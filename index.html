<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Library QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      padding: 15px;

      background: #111;

      color: white;

      font-family: Arial, sans-serif;

      text-align: center;

    }

    h1 {

      font-size: 24px;

      margin: 10px 0 5px;

    }

    .subtitle {

      color: #bbb;

      font-size: 14px;

      margin-bottom: 20px;

    }

    #reader {

      width: 100%;

      max-width: 600px;

      margin: auto;

      background: black;

      border-radius: 12px;

      overflow: hidden;

    }

    #message {

      max-width: 600px;

      margin: 15px auto;

      padding: 14px;

      border-radius: 8px;

      background: #222;

    }

    .success {

      background: #164d25 !important;

      color: #9cffad;

    }

    .error {

      background: #5a1616 !important;

      color: #ffb3b3;

    }

    button {

      width: 100%;

      max-width: 600px;

      padding: 16px;

      margin-top: 15px;

      border: none;

      border-radius: 9px;

      background: white;

      color: black;

      font-size: 17px;

      font-weight: bold;

    }

  </style>

</head>


<body>


<h1>
  📷 Library QR Scanner
</h1>


<div class="subtitle">
  Scan the student's QR code
</div>


<div id="reader"></div>


<div id="message">
  Starting camera...
</div>


<button
  id="backButton"
  onclick="goBack()"
  style="display:none;"
>
  ← RETURN TO LIBRARY FORM
</button>


<script>


const params =
  new URLSearchParams(
    window.location.search
  );


const returnUrl =
  params.get('returnUrl');


let scanner = null;

let scanned = false;


/* =====================================
   MESSAGE
   ===================================== */

function showMessage(
  text,
  type = ''
) {

  const message =
    document.getElementById(
      'message'
    );

  message.innerHTML =
    text;

  message.className =
    type;

}


/* =====================================
   START CAMERA
   ===================================== */

async function startCamera() {

  try {

    scanner =
      new Html5Qrcode(
        'reader'
      );


    /*
     * FIRST METHOD
     *
     * Tell Chrome directly:
     *
     * "Use the rear camera."
     *
     * We do NOT request a specific
     * camera device ID.
     */

    await scanner.start(

      {
        facingMode: {
          ideal: 'environment'
        }
      },

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        },

        aspectRatio: 1.0

      },

      function(decodedText) {

        if (scanned) {

          return;

        }

        scanned = true;

        handleScan(
          decodedText
        );

      },

      function(errorMessage) {

        /*
         * Normal QR scanning errors
         * are ignored.
         */

      }

    );


    showMessage(
      'Camera ready. Scan the student QR code.'
    );

  }


  catch (firstError) {

    console.log(
      'First camera attempt failed:',
      firstError
    );


    /*
     * SECOND METHOD
     *
     * Try the simpler environment
     * camera request.
     */

    try {

      if (scanner) {

        await scanner.clear();

      }


      scanner =
        new Html5Qrcode(
          'reader'
        );


      await scanner.start(

        {
          facingMode: 'environment'
        },

        {

          fps: 10,

          qrbox: {
            width: 250,
            height: 250
          }

        },

        function(decodedText) {

          if (scanned) {

            return;

          }

          scanned = true;

          handleScan(
            decodedText
          );

        },

        function(errorMessage) {

          /*
           * Ignore normal scanning errors.
           */

        }

      );


      showMessage(
        'Camera ready. Scan the student QR code.'
      );

      return;

    }


    catch (secondError) {

      console.log(
        'Second camera attempt failed:',
        secondError
      );


      showMessage(

        'Unable to start camera.' +

        '<br><br>' +

        '<strong>[' +
        secondError.name +
        ']</strong>' +

        '<br>' +

        (
          secondError.message ||
          'Could not start camera.'
        ) +

        '<br><br>' +

        'Please close other apps or browser tabs using the camera, then reload this page.',

        'error'

      );


      document
        .getElementById(
          'backButton'
        )
        .style.display =
          'block';

    }

  }

}


/* =====================================
   HANDLE QR RESULT
   ===================================== */

async function handleScan(
  decodedText
) {

  const studentID =
    decodedText.trim();


  if (!studentID) {

    scanned = false;

    return;

  }


  showMessage(

    '✓ Student ID detected: ' +
    studentID +

    '<br><br>' +

    'Returning to library form...',

    'success'

  );


  /*
   * If scanner was opened directly,
   * there won't be a return URL.
   */

  if (!returnUrl) {

    showMessage(

      'Student ID detected: ' +
      studentID +

      '<br><br>' +

      'No return address was provided.',

      'error'

    );


    document
      .getElementById(
        'backButton'
      )
      .style.display =
        'block';


    return;

  }


  /*
   * Stop camera before leaving.
   */

  try {

    if (scanner) {

      await scanner.stop();

    }

  }

  catch (error) {

    console.log(
      error
    );

  }


  /*
   * Send ID back to Google Apps Script.
   */

  const destination =

    returnUrl +

    '?studentId=' +

    encodeURIComponent(
      studentID
    );


  setTimeout(

    function() {

      window.location.href =
        destination;

    },

    700

  );

}


/* =====================================
   BACK BUTTON
   ===================================== */

function goBack() {

  if (returnUrl) {

    window.location.href =
      returnUrl;

  }

  else {

    window.history.back();

  }

}


/* =====================================
   START AFTER PAGE LOAD
   ===================================== */

window.addEventListener(

  'load',

  function() {

    startCamera();

  }

);

</script>


</body>

</html>
