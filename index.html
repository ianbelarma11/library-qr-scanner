<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Library QR Scanner</title>


  <!-- QR SCANNER LIBRARY -->

  <script
    src="https://unpkg.com/html5-qrcode"
  ></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 15px;

      background: #111;

      color: white;

      font-family: Arial, sans-serif;

      text-align: center;

    }


    h1 {

      font-size: 24px;

      margin:
        10px 0 5px 0;

    }


    .subtitle {

      color: #bbb;

      font-size: 14px;

      margin-bottom: 20px;

    }


    #reader {

      width: 100%;

      max-width: 600px;

      margin: auto;

      background: black;

      border-radius: 12px;

      overflow: hidden;

    }


    .message {

      max-width: 600px;

      margin: 15px auto;

      padding: 14px;

      border-radius: 8px;

      background: #222;

      color: #ddd;

    }


    .success {

      background: #164d25;

      color: #9cffad;

    }


    .error {

      background: #5a1616;

      color: #ffb3b3;

    }


    .back-button {

      display: none;

      width: 100%;

      max-width: 600px;

      margin: 15px auto;

      padding: 16px;

      border: none;

      border-radius: 9px;

      background: white;

      color: black;

      font-size: 17px;

      font-weight: bold;

    }

  </style>

</head>


<body>


  <h1>
    📷 Library QR Scanner
  </h1>


  <div class="subtitle">

    Point the camera at the student's QR code.

  </div>


  <div id="reader"></div>


  <div
    id="message"
    class="message"
  >

    Starting camera...

  </div>


  <button
    id="backButton"
    class="back-button"
    onclick="goBack()"
  >

    ← RETURN TO LIBRARY FORM

  </button>


<script>


/* =====================================
   GET RETURN URL
   ===================================== */

const params =
  new URLSearchParams(
    window.location.search
  );


const returnUrl =
  params.get('returnUrl');


/* =====================================
   SCANNER
   ===================================== */

let scanner = null;

let scanned = false;


/* =====================================
   START
   ===================================== */

function startScanner() {


  scanner =
    new Html5Qrcode(
      'reader'
    );


  scanner.start(

    {
      facingMode: 'environment'
    },

    {

      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      },

      aspectRatio: 1.0

    },

    function(decodedText) {

      if (scanned) {
        return;
      }


      scanned = true;


      handleScan(
        decodedText
      );

    },

    function(errorMessage) {

      /*
       * Normal scanning errors
       * are intentionally ignored.
       */

    }

  )


  .then(function() {

    showMessage(
      'Camera ready. Scan the student QR code.',
      ''
    );

  })


  .catch(function(error) {

    console.error(
      error
    );


    let message =
      'Unable to start camera.';


    if (
      error &&
      error.name
    ) {

      message +=
        ' [' +
        error.name +
        ']';

    }


    if (
      error &&
      error.message
    ) {

      message +=
        ' ' +
        error.message;

    }


    showMessage(
      message,
      'error'
    );


    document
      .getElementById(
        'backButton'
      )
      .style.display =
        'block';

  });

}


/* =====================================
   HANDLE QR
   ===================================== */

function handleScan(
  decodedText
) {


  const studentID =
    decodedText.trim();


  if (!studentID) {

    scanned = false;

    return;

  }


  showMessage(
    '✓ Student ID detected: ' +
    studentID +
    '<br><br>Returning to library form...',
    'success'
  );


  if (!returnUrl) {

    showMessage(
      'Student ID detected: ' +
      studentID +
      '<br><br>' +
      'No return address was provided.',
      'error'
    );


    document
      .getElementById(
        'backButton'
      )
      .style.display =
        'block';


    return;

  }


  /*
   * Stop the camera before leaving.
   */

  if (scanner) {

    scanner
      .stop()
      .catch(function(error) {

        console.log(
          error
        );

      });

  }


  /*
   * Send the Student ID back
   * to the library application.
   */

  const destination =
    returnUrl +
    '?studentId=' +
    encodeURIComponent(
      studentID
    );


  setTimeout(
    function() {

      window.location.href =
        destination;

    },
    700
  );

}


/* =====================================
   MESSAGE
   ===================================== */

function showMessage(
  text,
  type
) {


  const message =
    document
      .getElementById(
        'message'
      );


  message.innerHTML =
    text;


  message.className =
    'message ' +
    type;

}


/* =====================================
   BACK
   ===================================== */

function goBack() {


  if (returnUrl) {

    window.location.href =
      returnUrl;

  }

  else {

    window.history.back();

  }

}


/* =====================================
   START WHEN PAGE LOADS
   ===================================== */

window.onload =
  function() {

    startScanner();

  };


</script>


</body>

</html>
