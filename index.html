<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Library QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      font-size: 24px;
      margin: 10px 0 5px;
    }

    .subtitle {
      color: #bbb;
      font-size: 14px;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      max-width: 600px;
      margin: auto;
      background: black;
      border-radius: 12px;
      overflow: hidden;
    }

    #message {
      max-width: 600px;
      margin: 15px auto;
      padding: 14px;
      border-radius: 8px;
      background: #222;
    }

    .success {
      background: #164d25 !important;
      color: #9cffad;
    }

    .error {
      background: #5a1616 !important;
      color: #ffb3b3;
    }

    button {
      width: 100%;
      max-width: 600px;
      padding: 16px;
      margin-top: 15px;
      border: none;
      border-radius: 9px;
      background: white;
      color: black;
      font-size: 17px;
      font-weight: bold;
    }

  </style>

</head>


<body>

  <h1>📷 Library QR Scanner</h1>

  <div class="subtitle">
    Scan the student's QR code
  </div>

  <div id="reader"></div>

  <div id="message">
    Starting camera...
  </div>

  <button
    id="backButton"
    onclick="goBack()"
    style="display:none;"
  >
    ← RETURN TO LIBRARY FORM
  </button>


<script>

  const params =
    new URLSearchParams(
      window.location.search
    );

  const returnUrl =
    params.get('returnUrl');

  let scanner = null;

  let scanned = false;


  function showMessage(
    text,
    type = ''
  ) {

    const message =
      document.getElementById(
        'message'
      );

    message.innerHTML = text;

    message.className = type;

  }


  async function startCamera() {

    try {

      /*
       * First ask the browser for the
       * available cameras.
       */

      const cameras =
        await Html5Qrcode.getCameras();


      if (
        !cameras ||
        cameras.length === 0
      ) {

        throw new Error(
          'No camera was found on this device.'
        );

      }


      /*
       * Prefer the back/rear camera.
       */

      let cameraId =
        cameras[0].id;


      for (
        let i = 0;
        i < cameras.length;
        i++
      ) {

        const label =
          cameras[i].label.toLowerCase();


        if (
          label.includes('back') ||
          label.includes('rear') ||
          label.includes('environment')
        ) {

          cameraId =
            cameras[i].id;

          break;

        }

      }


      scanner =
        new Html5Qrcode(
          'reader'
        );


      await scanner.start(

        cameraId,

        {

          fps: 10,

          qrbox: {
            width: 250,
            height: 250
          },

          aspectRatio: 1.0

        },

        function(decodedText) {

          if (scanned) {
            return;
          }

          scanned = true;

          handleScan(
            decodedText
          );

        },

        function(errorMessage) {

          /*
           * Ignore normal QR scanning
           * errors while searching.
           */

        }

      );


      showMessage(
        'Camera ready. Scan the student QR code.'
      );

    }

    catch (error) {

      console.error(
        'Camera error:',
        error
      );


      let errorText =
        'Unable to start camera.';


      if (error.name) {

        errorText +=
          '<br><br>[' +
          error.name +
          ']';

      }


      if (error.message) {

        errorText +=
          '<br>' +
          error.message;

      }


      showMessage(
        errorText,
        'error'
      );


      document
        .getElementById(
          'backButton'
        )
        .style.display =
          'block';

    }

  }


  async function handleScan(
    decodedText
  ) {

    const studentID =
      decodedText.trim();


    if (!studentID) {

      scanned = false;

      return;

    }


    showMessage(
      '✓ Student ID detected: ' +
      studentID +
      '<br><br>Returning to library form...',
      'success'
    );


    if (!returnUrl) {

      showMessage(
        'Student ID detected: ' +
        studentID +
        '<br><br>No return address was provided.',
        'error'
      );

      document
        .getElementById(
          'backButton'
        )
        .style.display =
          'block';

      return;

    }


    try {

      if (scanner) {

        await scanner.stop();

      }

    }

    catch (error) {

      console.log(
        error
      );

    }


    const destination =
      returnUrl +
      '?studentId=' +
      encodeURIComponent(
        studentID
      );


    setTimeout(
      function() {

        window.location.href =
          destination;

      },
      700
    );

  }


  function goBack() {

    if (returnUrl) {

      window.location.href =
        returnUrl;

    }

    else {

      window.history.back();

    }

  }


  /*
   * Start camera after the page
   * has completely loaded.
   */

  window.addEventListener(
    'load',
    function() {

      startCamera();

    }
  );

</script>

</body>

</html>
